run-name: Sleepy Hub ARM64 preview debug build
name: Sleepy Hub ARM64 preview debug

concurrency:
  group: sleepyhub-debug-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - 'sleepyhub/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Build ARM64 debug APK
        run: ./gradlew --no-daemon :app:assembleDebug -PsleepyHubArm64Only=true
      - name: Verify preview APK identity, signature, and ABI
        shell: bash
        run: |
          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          build_tools="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          aapt="$ANDROID_HOME/build-tools/$build_tools/aapt"
          apksigner="$ANDROID_HOME/build-tools/$build_tools/apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          "$aapt" dump badging "$apk" | grep -F "package: name='com.cutiecookie.sleepyhub.preview'"
          "$aapt" dump badging "$apk" | grep -F "application-label:'Sleepy Hub Preview'"
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libblackbox.so'
          sha256sum "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sleepy-hub-arm64-preview-debug
          path: app/build/outputs/apk/debug/**/*.apk
          if-no-files-found: error
          retention-days: 7
