name: Sleepy Hub Diagnostic Preview

on:
  pull_request:
    branches:
      - sleepyhub/bugfix-install-switch-polish
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build diagnostic ARM64 preview
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out diagnostic PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: true

      - name: Build ARM64 diagnostic APK
        run: ./gradlew --no-daemon :app:assembleDebug -PsleepyHubArm64Only=true

      - name: Verify preview package, signing identity, and ABI
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          build_tools="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          aapt="$ANDROID_HOME/build-tools/$build_tools/aapt"
          apksigner="$ANDROID_HOME/build-tools/$build_tools/apksigner"
          signer_output="$("$apksigner" verify --verbose --print-certs "$apk")"
          printf '%s\n' "$signer_output"
          printf '%s\n' "$signer_output" | grep -F "certificate SHA-256 digest: cbd3ce49b15de6f54b8b191f8e99e8dcd6610e6f6895ca7f5d522d855c009f20"
          "$aapt" dump badging "$apk" | grep -F "package: name='com.cutiecookie.sleepyhub.preview'"
          "$aapt" dump badging "$apk" | grep -F "application-label:'Sleepy Hub Preview'"
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libblackbox.so'
          sha256sum "$apk"

      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: sleepy-hub-arm64-diagnostic-preview
          path: app/build/outputs/apk/debug/**/*.apk
          if-no-files-found: error
          retention-days: 7
