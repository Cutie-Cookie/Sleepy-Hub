plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
    alias(libs.plugins.kotlin.compose)
}

android {

    namespace 'top.niunaijun.blackboxa'
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion = "29.0.13846066"
    defaultConfig {
        applicationId "com.cutiecookie.sleepyhub"
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }

    splits {
        abi {
            enable true
            reset()
            if (project.findProperty('sleepyHubArm64Only') == 'true') {
                include 'arm64-v8a'
                universalApk false
            } else {
                include 'armeabi-v7a', 'arm64-v8a'
                universalApk true
            }
        }
    }

    signingConfigs {
        previewDebug {
            storeFile file("sleepyhub-preview-debug.keystore")
            storePassword "sleepyhub-preview"
            keyAlias "sleepyhub-preview"
            keyPassword "sleepyhub-preview"
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".preview"
            versionNameSuffix "-preview"
            signingConfig signingConfigs.previewDebug
            resValue "string", "app_name", "Sleepy Hub Preview"
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        viewBinding true
        compose true
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    packaging {
        jniLibs {
            excludes.add("**/libandroidx.graphics.path.so")
        }
        resources {
            excludes.add("**/libandroidx.graphics.path.so")
        }
    }
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            output.outputFileName = "SleepyHub_${variant.versionName}_${output.baseName}.apk"
        }
    }
}

